<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IT-Hub · Service Desk</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">IT</span><div><strong>IT-Hub</strong><small>Service Desk</small></div></div>
    <nav><button class="nav active">Overview</button><button class="nav" data-scroll="tickets">Tickets</button><button class="nav" data-scroll="assets">Assets</button></nav>
    <div class="sidebar-foot"><span class="status-dot"></span> Systems operational<br><small>Last checked just now</small></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><p class="kicker">Thursday, August 27</p><h1>Good afternoon, Mika</h1></div><div class="avatar">MR</div></header>
    <section class="metrics" id="metrics"></section>
    <section class="content-grid">
      <div class="panel" id="tickets"><div class="panel-head"><div><h2>Support queue</h2><p>Recent incidents and requests</p></div><div class="filters"><input id="search" placeholder="Search tickets…"><select id="priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Issue</th><th>Priority</th><th>Status</th><th>Assignee</th></tr></thead><tbody id="ticketRows"></tbody></table></div></div>
      <div class="panel" id="assets"><div class="panel-head"><div><h2>Asset inventory</h2><p>Company equipment overview</p></div><span class="pill">5 tracked</span></div><div id="assetList" class="asset-list"></div></div>
    </section>
  </main>
<script src="/app.js"></script>
</body>
</html>
